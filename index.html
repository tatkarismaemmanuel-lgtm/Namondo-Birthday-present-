<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Sweet 16 Magdalene 💖</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1a0026, #000);
    color: white;
    text-align: center;
    overflow-x: hidden;
}

.container {
    margin-top: 60px;
}

h1 {
    font-size: 3em;
    color: #ff4da6;
}

h2 {
    color: #ff99cc;
}

.message {
    width: 80%;
    margin: auto;
    font-size: 1.2em;
    min-height: 100px;
}

/* Typing cursor */
.cursor {
    border-right: 2px solid white;
    animation: blink 1s infinite;
}
@keyframes blink {
    0%,100%{border-color:white;}
    50%{border-color:transparent;}
}

/* Button */
button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 20px;
    background: #ff4da6;
    color: white;
    font-size: 1em;
    cursor: pointer;
}

button:hover {
    transform: scale(1.1);
}

/* Cake */
.cake {
    margin: 30px auto;
    width: 100px;
    height: 100px;
    position: relative;
}

.layer {
    width: 100px;
    height: 30px;
    background: pink;
    margin: 2px 0;
    border-radius: 5px;
}

.candle {
    width: 10px;
    height: 30px;
    background: white;
    position: absolute;
    left: 45px;
    top: -30px;
}

.flame {
    width: 10px;
    height: 10px;
    background: orange;
    border-radius: 50%;
    position: absolute;
    top: -10px;
    animation: flicker 0.3s infinite;
}

@keyframes flicker {
    0% {transform: scale(1);}
    100% {transform: scale(1.3);}
}

/* Gallery */
.gallery img {
    width: 100px;
    margin: 5px;
    border-radius: 10px;
}

/* Floating hearts */
.heart {
    position: fixed;
    bottom: 0;
    color: pink;
    animation: float 5s linear infinite;
}

@keyframes float {
    0% {transform: translateY(0);}
    100% {transform: translateY(-100vh);}
}
</style>
</head>

<body>

<div class="container">
    <h1>🎉 Happy Sweet 16 🎉</h1>
    <h2>Namundo Magdalene 💖</h2>

    <div class="message" id="typing"></div>

    <!-- Cake -->
    <div class="cake">
        <div class="candle">
            <div class="flame"></div>
        </div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
    </div>

    <button onclick="showSurprise()">Click for Surprise 🎁</button>

    <div id="surprise" style="display:none;">
        💫 You are beautiful, strong, and unforgettable 💫<br>
        Enjoy every moment of your special day 💕
    </div>

    <!-- Gallery -->
    <div class="gallery">
        <p>Add her pictures here 📸</p>
        <img src="photo1.jpg">
        <img src="photo2.jpg">
        <img src="photo3.jpg">
    </div>

</div>
<audio id="music" loop>
    <source src="music.mp3">
</audio>

<button onclick="playMusic()">🎵 Play Music</button>


<script>
// Typing effect
const text = "From 12 midnight, the stars shine brighter because of you ✨\nYou are truly special and loved 💖\nMay your dreams grow bigger every year 🌸";
let i = 0;

function typeWriter() {
    if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
    }
}
typeWriter();

// Surprise
function showSurprise() {
    document.getElementById("surprise").style.display = "block";
}

// Floating hearts
setInterval(() => {
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);
}, 300);
</script>

</body>
</html>
